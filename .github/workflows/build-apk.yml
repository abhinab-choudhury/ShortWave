name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        working-directory: apps/client
        run: pnpm run mobile:build

      - name: Build release APK
        working-directory: apps/client/android
        run: |
          ./gradlew assembleRelease --console=plain \
            -PversionCode=${{ github.run_number }} \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.internal.http.socketTimeout=300000 \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.repository.max.retries=5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shortwave-apk
          path: apps/client/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shortwave APK (latest)
          body: |
            Automated release — APK built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Install the attached `app-release.apk` directly on any Android phone.
          files: apps/client/android/app/build/outputs/apk/release/*.apk
          update_release_body: true
          make_latest: true
          fail_on_unmatched_files: true
