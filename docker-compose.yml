version: "3.8"

services:
  mongo:
    image: mongo
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: ["mongod", "--replSet", "rs0", "--quiet", "--logpath", "/dev/null"]

  redis:
    image: redis/redis-stack
    container_name: redis-stack
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  redis_data:
